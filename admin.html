<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Water Bottle Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">

  <!-- PIN Lock -->
  <div id="loginBox" class="max-w-sm mx-auto mt-16 bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
    <h1 class="text-lg font-bold text-sky-400">Water Bottle Media Admin</h1>
    <p class="text-xs text-slate-400">Default PIN: 6379</p>
    <input id="adminPin" type="password" inputmode="numeric" placeholder="Enter Admin PIN"
      class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-lg" />
    <button onclick="unlockAdmin()" class="w-full bg-sky-500 text-slate-950 font-bold py-3 rounded-xl">Unlock Dashboard</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden max-w-lg mx-auto space-y-6">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-extrabold">Campaign Manager</h1>
        <p class="text-xs text-slate-400">Water Bottle Media • 6379025071</p>
      </div>
      <button onclick="loadCampaigns()" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg">↻ Refresh</button>
    </div>

    <!-- Add New Video Brand -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <h2 class="text-sm font-bold text-sky-400">+ Add New Video Brand / YouTube</h2>
      <input id="bName" placeholder="Brand / Channel Name" class="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm" />
      <input id="vUrl" placeholder="Direct MP4 Video Link (https://...)" class="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm" />
      <input id="cText" placeholder="Button Text (e.g., Subscribe on YouTube)" class="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm" />
      <input id="cUrl" placeholder="YouTube / WhatsApp Link" class="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm" />
      <input id="mViews" type="number" placeholder="Booked Views (e.g., 1000)" class="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm" />
      <button onclick="addCampaign()" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-sm">
        Launch Campaign
      </button>
    </div>

    <!-- Live Campaigns List -->
    <div id="campaignList" class="space-y-3"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://todgaupejlrckrqfntih.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8Q6QGQc1PPYs0QcoYXpQdg_nBT0HGSo";
    const ADMIN_PIN = "6379";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function unlockAdmin() {
      if (document.getElementById("adminPin").value === ADMIN_PIN) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadCampaigns();
      } else {
        alert("Wrong PIN");
      }
    }

    async function loadCampaigns() {
      const { data } = await db.from("campaigns").select("*").order("id", { ascending: false });
      const list = document.getElementById("campaignList");
      list.innerHTML = "";

      data.forEach(c => {
        const rev = c.views_count * 1;
        list.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
            <div>
              <p class="font-bold text-sm">${c.brand_name}</p>
              <p class="text-xs text-slate-400">Views: <span class="text-white font-bold">${c.views_count} / ${c.max_views}</span> (₹${rev})</p>
            </div>
            <button onclick="toggleStatus(${c.id}, ${!c.is_active})"
              class="px-3 py-1.5 rounded-lg text-xs font-bold ${c.is_active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">
              ${c.is_active ? 'ACTIVE' : 'PAUSED'}
            </button>
          </div>
        `;
      });
    }

    async function addCampaign() {
      const payload = {
        brand_name: document.getElementById("bName").value,
        offer_title: "30s Video Promo",
        video_url: document.getElementById("vUrl").value,
        cta_text: document.getElementById("cText").value || "Subscribe on YouTube",
        cta_url: document.getElementById("cUrl").value,
        max_views: parseInt(document.getElementById("mViews").value) || 1000,
        is_active: true
      };
      await db.from("campaigns").insert([payload]);
      alert("Campaign Launched!");
      loadCampaigns();
    }

    async function toggleStatus(id, newStatus) {
      await db.from("campaigns").update({ is_active: newStatus }).eq("id", id);
      loadCampaigns();
    }
  </script>
</body>
</html>
